<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>瞬時単語TEST</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --text:#1c1f23; --muted:#8a9099;
  --line:#e6e8eb; --primary:#3563e9; --green:#12a15a; --red:#e04a3f;
  --orange:#e8871e; --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Meiryo",
    "Noto Sans JP","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.6;
}
ruby rt{font-size:.42em;color:#9aa0a8;font-weight:400;letter-spacing:0;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;font-size:15px;}

.screen{display:none;min-height:100vh;padding-bottom:40px;}
.screen.active{display:block;}

.home-head{padding:38px 20px 18px;text-align:center;}
.home-head h1{
  margin:0;font-size:30px;letter-spacing:.14em;font-weight:700;
  background:linear-gradient(135deg,#3563e9,#7b3fe4);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.home-head p{margin:8px 0 0;font-size:12px;color:var(--muted);letter-spacing:.22em;}
.pad{padding:0 16px;max-width:760px;margin:0 auto;}

.card{
  background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:14px;
  box-shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px -10px rgba(16,24,40,.12);
}
.card h3{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.06em;}

.mode-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px;}
.mode-chip{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding:12px 6px;border-radius:12px;background:#f7f8fa;border:1.5px solid transparent;
  transition:.16s;font-size:13.5px;font-weight:500;
}
.mode-chip:active{transform:scale(.97);}
.mode-chip.active{background:#eef3ff;border-color:var(--primary);color:var(--primary);}
.mode-chip .mc-count{font-size:11px;color:var(--muted);font-weight:400;}
.mode-chip.active .mc-count{color:#7d99e8;}

.row{display:flex;gap:10px;align-items:center;}
.input,.select,.textarea{
  width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;
  background:#fbfbfc;outline:none;transition:.15s;color:var(--text);
}
.input:focus,.select:focus,.textarea:focus{border-color:var(--primary);background:#fff;}
.textarea{resize:vertical;line-height:1.7;font-size:14px;}

.size-row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;}
.size-pill{padding:6px 14px;border-radius:20px;background:#f2f3f5;font-size:13px;color:#555;transition:.15s;}
.size-pill.active{background:var(--primary);color:#fff;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;padding:13px 20px;
  border-radius:13px;font-size:15.5px;font-weight:600;transition:.15s;width:100%;
}
.btn:active{transform:scale(.985);}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 16px -6px rgba(53,99,233,.6);}
.btn-ghost{background:#f2f3f5;color:#4a4f57;}
.btn-big{padding:17px;font-size:17px;letter-spacing:.08em;}

.stat-line{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:3px 0;}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;gap:10px;}
.topbar h2{margin:0;font-size:16px;font-weight:600;}
.icon-btn{padding:7px 13px;border-radius:9px;background:#eceef1;font-size:13.5px;color:#4a4f57;font-weight:500;}
.icon-btn.danger{background:#fdeceb;color:var(--red);}

.quiz-wrap{max-width:620px;margin:0 auto;padding:0 16px;display:flex;flex-direction:column;min-height:calc(100vh - 70px);}
.progress-track{height:5px;background:#e7e9ec;border-radius:3px;overflow:hidden;margin-bottom:6px;}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#3563e9,#7b3fe4);border-radius:3px;transition:width .3s;}

.word-stage{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:30px 10px;text-align:center;min-height:230px;
}
.word-display{
  font-size:clamp(42px,12vw,68px);font-weight:600;letter-spacing:.03em;
  line-height:1.45;word-break:break-word;
}
.meaning-display{
  margin-top:26px;font-size:19px;color:#3c4249;line-height:1.75;max-width:520px;
  opacity:0;transform:translateY(8px);transition:.28s;
}
.meaning-display.show{opacity:1;transform:none;}
.m-label{
  display:inline-block;font-size:11px;background:#eef3ff;color:var(--primary);
  padding:2px 9px;border-radius:20px;margin-right:9px;vertical-align:middle;
  letter-spacing:.1em;font-weight:600;
}

.actions{display:none;gap:12px;padding-bottom:28px;}
.actions.show{display:flex;}
.actions .btn{flex:1;}
.btn-known{background:var(--green);color:#fff;box-shadow:0 6px 16px -6px rgba(18,161,90,.55);}
.btn-unknown{background:#fff;color:var(--red);border:1.8px solid #f5cdc9;}
.btn-next{background:var(--primary);color:#fff;box-shadow:0 6px 16px -6px rgba(53,99,233,.6);}
.btn-wrong{background:#fff;color:var(--orange);border:1.8px solid #f8ddb8;}

.overlay{
  position:fixed;inset:0;background:rgba(28,31,35,.55);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;z-index:100;padding:20px;
}
.overlay.show{display:flex;}
.overlay-card{background:#fff;border-radius:20px;padding:30px 26px;text-align:center;width:100%;max-width:320px;}
.overlay-card h3{margin:8px 0 4px;font-size:19px;}
.overlay-card p{margin:0 0 20px;color:var(--muted);font-size:13.5px;}
.pause-icon{font-size:38px;}

.result-summary{font-size:13.5px;color:var(--muted);margin-bottom:14px;}
.wrong-list{display:flex;flex-direction:column;gap:9px;max-height:52vh;overflow-y:auto;}
.wrong-item{display:flex;gap:12px;padding:13px 14px;background:#fbfbfc;border-radius:13px;border:1px solid var(--line);}
.wi-idx{
  flex:0 0 24px;height:24px;border-radius:50%;background:#eef3ff;color:var(--primary);
  font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:600;margin-top:3px;
}
.wi-word{font-size:26px;font-weight:600;line-height:1.5;}
.wi-meaning{font-size:14px;color:#5a6068;margin-top:3px;}
.empty{text-align:center;padding:34px 10px;color:var(--muted);font-size:15px;}

.dropzone{
  border:2px dashed #d4d8de;border-radius:14px;padding:30px 16px;text-align:center;
  transition:.18s;background:#fafbfc;
}
.dropzone.drag{border-color:var(--primary);background:#f0f4ff;}
.dz-icon{font-size:30px;color:#b9bfc7;line-height:1;}
.dz-text{margin-top:8px;font-size:15px;font-weight:500;}
.dz-sub{margin-top:5px;font-size:11.5px;color:var(--muted);line-height:1.6;}
.status{margin-top:12px;font-size:13.5px;color:var(--primary);min-height:0;word-break:break-all;}
.status.err{color:var(--red);}
.status.ok{color:var(--green);}

.preview-list{max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:11px;}
.preview-row{
  display:grid;grid-template-columns:28px 1.2fr 1fr 1.4fr;gap:8px;
  padding:9px 11px;font-size:13px;border-bottom:1px solid #f0f1f3;align-items:center;
}
.preview-row:last-child{border-bottom:none;}
.preview-row.head{
  background:#f7f8fa;font-weight:600;color:var(--muted);font-size:11.5px;
  position:sticky;top:0;letter-spacing:.05em;
}
.pv-idx{color:#b0b6bd;font-size:11px;}
.pv-w{font-size:16px;font-weight:600;}
.pv-r{color:#7a8089;}
.pv-m{color:#5a6068;font-size:12.5px;}

.mt10{margin-top:10px;}
.mt14{margin-top:14px;}
.hint{font-size:12px;color:var(--muted);line-height:1.75;}

.toast{
  position:fixed;left:50%;bottom:44px;transform:translate(-50%,16px);
  background:rgba(28,31,35,.9);color:#fff;padding:11px 22px;border-radius:24px;
  font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:200;white-space:nowrap;
}
.toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>

<!-- ============ 主页面 ============ -->
<section id="screen-home" class="screen active">
  <div class="home-head">
    <h1>瞬時単語TEST</h1>
    <p>INSTANT VOCABULARY TEST</p>
  </div>
  <div class="pad">
    <div class="card">
      <h3>选择模式</h3>
      <div class="mode-grid" id="modeGrid"></div>
    </div>

    <div class="card">
      <h3>每组题量</h3>
      <div class="row">
        <input type="number" id="groupSize" class="input" value="20" min="1" max="9999">
      </div>
      <div class="size-row" id="sizeRow">
        <button class="size-pill" data-n="10">10</button>
        <button class="size-pill" data-n="20">20</button>
        <button class="size-pill" data-n="30">30</button>
        <button class="size-pill" data-n="50">50</button>
        <button class="size-pill" data-n="100">100</button>
        <button class="size-pill" data-n="0">全部</button>
      </div>
    </div>

    <button class="btn btn-primary btn-big" id="btnStart">开 始 测 试</button>

    <div class="card mt14">
      <h3>词库管理</h3>
      <div class="stat-line"><span>当前模式</span><span id="homeModeName">—</span></div>
      <div class="stat-line"><span>收录词数</span><span id="homeModeCount">0</span></div>
      <button class="btn btn-ghost mt10" id="btnImport">快速导入</button>
    </div>
  </div>
</section>

<!-- ============ 答题页 ============ -->
<section id="screen-quiz" class="screen">
  <div class="topbar">
    <span class="icon-btn" id="quizMode">—</span>
    <span style="font-size:14px;color:#8a9099;font-weight:600;" id="quizProgress">0 / 0</span>
    <span style="display:flex;gap:8px;">
      <button class="icon-btn" id="btnPause">暂停</button>
      <button class="icon-btn danger" id="btnStop">终止</button>
    </span>
  </div>
  <div class="quiz-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="word-stage">
      <div class="word-display" id="wordDisplay"></div>
      <div class="meaning-display" id="meaningDisplay"></div>
    </div>
    <div class="actions show" id="actionsP1">
      <button class="btn btn-known" id="btnKnown">认 识</button>
      <button class="btn btn-unknown" id="btnUnknown">不 认 识</button>
    </div>
    <div class="actions" id="actionsP2">
      <button class="btn btn-next" id="btnNext">下 一 个</button>
      <button class="btn btn-wrong" id="btnWrong">答 错 了</button>
    </div>
  </div>
</section>

<!-- ============ 结果页 ============ -->
<section id="screen-result" class="screen">
  <div class="topbar">
    <span style="width:70px"></span>
    <h2>本轮错词本</h2>
    <span style="width:70px"></span>
  </div>
  <div class="pad">
    <div class="result-summary" id="resultSummary"></div>
    <div class="card">
      <div class="wrong-list" id="wrongList"></div>
    </div>
    <div class="actions show" style="padding-bottom:10px;">
      <button class="btn btn-primary" id="btnRestart">重 新 开 始</button>
      <button class="btn btn-ghost" id="btnQuit">退 出</button>
    </div>
  </div>
</section>

<!-- ============ 快速导入页 ============ -->
<section id="screen-import" class="screen">
  <div class="topbar">
    <button class="icon-btn" id="importBack">‹ 返回</button>
    <h2>快速导入</h2>
    <span style="width:70px"></span>
  </div>
  <div class="pad">
    <div class="card">
      <h3>1 · 选择目标模式</h3>
      <select class="select" id="importMode"></select>
      <h3 class="mt14">2 · 输入开发者密钥</h3>
      <input class="input" type="password" id="importKey"
             inputmode="numeric" pattern="[0-9]*" maxlength="6"
             autocomplete="off" placeholder="请输入6位数字开发者密钥">
    </div>

    <div class="card">
      <h3>3 · 上传文件</h3>
      <div class="dropzone" id="dropZone">
        <input type="file" id="fileInput" hidden
          accept=".txt,.csv,.tsv,.md,.xlsx,.xls,.docx,.pdf,.jpg,.jpeg,.png,.webp,.bmp">
        <div class="dz-icon">＋</div>
        <div class="dz-text">点击或拖拽文件到此处</div>
        <div class="dz-sub">
          支持 .jpg / .png / .pdf / .xlsx / .xls / .docx / .txt / .csv<br>
          图片与 PDF 走 OCR，首次使用需联网加载解析库
        </div>
      </div>
      <div class="status" id="importStatus"></div>
    </div>

    <div class="card">
      <h3>或直接粘贴文本</h3>
      <textarea class="textarea" id="pasteArea" rows="6"
        placeholder="每行一条，支持以下格式：&#10;勉強|べんきょう|学习&#10;勉強[べんきょう] 学习&#10;勉強	べんきょう	学习&#10;勉強 べんきょう 学习"></textarea>
      <button class="btn btn-ghost mt10" id="btnParsePaste">解 析 文 本</button>
    </div>

    <div class="card" id="previewCard" style="display:none">
      <h3>4 · 预览与确认 <span id="previewCount" style="color:var(--primary)"></span></h3>
      <div class="preview-list" id="previewList"></div>
      <div class="row mt14">
        <button class="btn btn-primary" id="btnConfirmImport">确 认 导 入</button>
        <button class="btn btn-ghost" id="btnClearPreview">清 空</button>
      </div>
    </div>
  </div>
</section>

<!-- 暂停遮罩 -->
<div class="overlay" id="pauseOverlay">
  <div class="overlay-card">
    <div class="pause-icon">⏸</div>
    <h3>已暂停</h3>
    <p>当前进度已保留</p>
    <button class="btn btn-primary" id="btnResume">继 续</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   瞬時単語TEST — 完整主逻辑（第 1 段结束，紧接第 2 段）
   ========================================================================= */

/* ---------------- 常量 ---------------- */
const MODES = ['N1','N2','N3','N4','N5','考研日语203','日语专业四级',
               '日语专业八级','大学日语四级','大学日语六级'];

/* 开发者密钥：所有模式共用，只有输入正确才允许导入 */
const DEV_KEY = '051025';

const LS_KEY = 'shunji_vocab_v1';

/* ---------------- 工具 ---------------- */
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
const KANJI_RE = /[\u4e00-\u9fff\u3400-\u4dbf\u3005\u3007]/;
function hasKanji(s){ return KANJI_RE.test(s || ''); }
function isKanjiChar(ch){ return KANJI_RE.test(ch); }
const KANA_RE = /^[\u3040-\u309f\u30a0-\u30ff\u30fc\u3005]+$/;
function isKana(s){ return KANA_RE.test(s || ''); }

function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let toastTimer = null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

/* ---------------- 振り仮名 自动切分 ---------------- */
function buildRuby(surface, reading){
  if (!surface) return '';
  if (!reading || !hasKanji(surface)) return esc(surface);

  const segs = [];
  let buf = '', type = null;
  for (const ch of surface){
    const t = isKanjiChar(ch) ? 'k' : 'a';
    if (t === type){ buf += ch; }
    else { if (buf) segs.push({ t: type, s: buf }); buf = ch; type = t; }
  }
  if (buf) segs.push({ t: type, s: buf });

  let out = '', rp = 0;
  for (let i = 0; i < segs.length; i++){
    const seg = segs[i];
    if (seg.t === 'a'){
      if (reading.startsWith(seg.s, rp)){ out += esc(seg.s); rp += seg.s.length; }
      else { out += esc(seg.s); }
    } else {
      const nextKana = (segs[i + 1] && segs[i + 1].t === 'a') ? segs[i + 1].s : '';
      let end;
      if (nextKana){
        const p = reading.indexOf(nextKana, rp);
        end = p >= 0 ? p : reading.length;
      } else {
        end = reading.length;
      }
      const rd = reading.slice(rp, end);
      out += rd
        ? '<ruby>' + esc(seg.s) + '<rt>' + esc(rd) + '</rt></ruby>'
        : esc(seg.s);
      rp = end;
    }
  }
  return out;
}

/* ---------------- 文本 → 词条 ---------------- */
function parseLine(raw){
  let line = String(raw || '').replace(/\u3000/g, ' ').trim();
  if (!line) return null;
  if (/^(单词|単語|word|序号|番号)[\s\|]/i.test(line)) return null;

  let parts = null;
  const br = line.match(/^(\S+?)\[([^\]]+)\]\s*(.*)$/);
  if (br){
    parts = [br[1], br[2], br[3]];
  } else if (line.includes('|')){
    parts = line.split('|');
  } else if (line.includes('\t')){
    parts = line.split('\t');
  } else if (/\s{2,}/.test(line)){
    parts = line.split(/\s{2,}/);
  } else {
    parts = line.split(/\s+/);
  }

  parts = parts.map(s => String(s == null ? '' : s).trim()).filter(s => s !== '');
  if (!parts.length) return null;

  let w = parts[0], r = '', m = '';
  if (parts.length === 1){
    m = '';
  } else if (parts.length === 2){
    if (isKana(parts[1])){ r = parts[1]; } else { m = parts[1]; }
  } else {
    if (isKana(parts[1])){ r = parts[1]; m = parts.slice(2).join(' '); }
    else { m = parts.slice(1).join(' '); }
  }
  if (!w) return null;
  return { w: w, r: r, m: m };
}

function textToEntries(text){
  const out = [];
  String(text || '').split(/\r?\n/).forEach(line => {
    const e = parseLine(line);
    if (e && e.w) out.push(e);
  });
  return out;
}

/* ---------------- 种子词库（日语专业四级） ---------------- */
const SEED_YOUJI4_RAW = `
溢れる|あふれる|溢出，充满
味わう|あじわう|品尝；体味
預ける|あずける|寄存，托付
与える|あたえる|给予
辺り|あたり|附近，周围
扱う|あつかう|处理，对待
当てる|あてる|碰，撞；猜
謝る|あやまる|道歉
争う|あらそう|争夺，争论
表す|あらわす|表示，表现
現れる|あらわれる|出现，显露
安心|あんしん|安心，放心
案内|あんない|向导，引导
意見|いけん|意见
育つ|そだつ|成长，发育

位置|いち|位置
一層|いっそう|更加
一致|いっち|一致
一般|いっぱん|一般，普通
移動|いどう|移动
従う|したがう|遵从，跟随
違反|いはん|违反
印刷|いんさつ|印刷
印象|いんしょう|印象
受ける|うける|接受，受到
承る|うけたまわる|恭听，接受（自谦）
動かす|うごかす|移动，打动
失う|うしなう|失去
疑う|うたがう|怀疑
写す|うつす|抄写，拍照
訴える|うったえる|控诉，诉说
訪れる|おとずれる|访问，到来
奪う|うばう|夺取
埋める|うめる|填埋
敬う|うやまう|尊敬
影響|えいきょう|影响
永遠|えいえん|永远
衛星|えいせい|卫星
栄養|えいよう|营养
描く|えがく|描绘
得る|える|得到
延期|えんき|延期
演技|えんぎ|演技
援助|えんじょ|援助
応じる|おうじる|响应，按照
応募|おうぼ|应募，报名
補う|おぎなう|补充
抑える|おさえる|压制，抑制
収める|おさめる|收纳，取得
惜しい|おしい|可惜的

/* ---------------- 答题状态 ---------------- */
const state = {
  mode: '',
  queue: [],
  idx: 0,
  phase: 1,
  wrong: [],
  total: 0,
  paused: false
};

function startQuiz(){
  const list = (DB[currentMode] || []).slice();
  if (!list.length){ toast('该模式词库为空，请先导入单词'); return; }

  let n = parseInt(document.getElementById('groupSize').value, 10);
  if (isNaN(n)) n = 20;

  shuffle(list);
  const size = (n <= 0 || n > list.length) ? list.length : n;

  state.mode   = currentMode;
  state.queue  = list.slice(0, size);
  state.idx    = 0;
  state.phase  = 1;
  state.wrong  = [];
  state.total  = size;
  state.paused = false;

  document.getElementById('quizMode').textContent = currentMode;
  document.getElementById('pauseOverlay').classList.remove('show');
  show('quiz');
  renderCard();
}

function renderCard(){
  const cur = state.queue[state.idx];
  if (!cur){ finishQuiz(); return; }

  const wd = document.getElementById('wordDisplay');
  const md = document.getElementById('meaningDisplay');
  const a1 = document.getElementById('actionsP1');
  const a2 = document.getElementById('actionsP2');

  wd.innerHTML = buildRuby(cur.w, cur.r);

  if (state.phase === 1){
    md.classList.remove('show');
    md.innerHTML = '';
    a1.classList.add('show');
    a2.classList.remove('show');
  } else {
    md.innerHTML = '<span class="m-label">意</span>' + esc(cur.m || '（无释义）');
    md.classList.add('show');
    a1.classList.remove('show');
    a2.classList.add('show');
  }

  document.getElementById('quizProgress').textContent =
    (state.idx + 1) + ' / ' + state.total;
  document.getElementById('progressFill').style.width =
    (state.idx / state.total * 100) + '%';
}

function goNextCard(){
  state.idx++;
  state.phase = 1;
  if (state.idx >= state.queue.length){ finishQuiz(); return; }
  renderCard();
}

/* 程序1 → 程序2 */
function onKnown(){   if (state.phase === 1){ state.phase = 2; renderCard(); } }
function onUnknown(){ if (state.phase === 1){ state.phase = 2; renderCard(); } }

/* 程序2 → 程序1 */
function onNext(){ if (state.phase === 2) goNextCard(); }

function onWrong(){
  if (state.phase !== 2) return;
  const cur = state.queue[state.idx];
  if (cur){
    const dup = state.wrong.some(e => e.w === cur.w && e.r === cur.r);
    if (!dup) state.wrong.push(cur);
    toast('已加入错词本');
  }
  goNextCard();
}

/* ---------------- 暂停 / 继续 / 终止 ---------------- */
function togglePause(){
  if (!document.getElementById('screen-quiz').classList.contains('active')) return;
  state.paused = true;
  document.getElementById('pauseOverlay').classList.add('show');
}
function resumeQuiz(){
  state.paused = false;
  document.getElementById('pauseOverlay').classList.remove('show');
}
function stopQuiz(){
  state.paused = false;
  document.getElementById('pauseOverlay').classList.remove('show');
  finishQuiz();
}

/* ---------------- 结果页 ---------------- */
function finishQuiz(){
  const list = document.getElementById('wrongList');
  document.getElementById('resultSummary').textContent =
    '本轮共 ' + state.total + ' 题 · 错词 ' + state.wrong.length + ' 个';

  if (!state.wrong.length){
    list.innerHTML = '<div class="empty">🎉 本轮没有错词，太棒了！</div>';
  } else {
    list.innerHTML = state.wrong.map((e, i) =>
      '<div class="wrong-item">' +
        '<div class="wi-idx">' + (i + 1) + '</div>' +
        '<div>' +
          '<div class="wi-word">' + buildRuby(e.w, e.r) + '</div>' +
          '<div class="wi-meaning">' + esc(e.m || '（无释义）') + '</div>' +
        '</div>' +
      '</div>'
    ).join('');
  }
  show('result');
}

let previewEntries = [];

function setStatus(msg, cls){
  const el = document.getElementById('importStatus');
  el.textContent = msg || '';
  el.className = 'status' + (cls ? ' ' + cls : '');
}

function loadScript(src){
  return new Promise((res, rej) => {
    if (document.querySelector('script[src="' + src + '"]')){ res(); return; }
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => res();
    s.onerror = () => rej(new Error('外部库加载失败：' + src));
    document.head.appendChild(s);
  });
}

/* --- 各格式解析 --- */
async function parseExcel(file){
  await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array' });
  const lines = [];
  wb.SheetNames.forEach(name => {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, blankrows: false });
    rows.forEach(r => {
      const cells = (r || []).map(c => String(c == null ? '' : c).trim()).filter(c => c !== '');
      if (cells.length) lines.push(cells.join('|'));
    });
  });
  return lines.join('\n');
}

async function parseDocx(file){
  await loadScript('https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js');
  const buf = await file.arrayBuffer();
  const r = await mammoth.extractRawText({ arrayBuffer: buf });
  return r.value;
}

async function parsePdf(file){
  await loadScript('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js');
  if (window.pdfjsLib && pdfjsLib.GlobalWorkerOptions){
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  }
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let text = '';
  for (let i = 1; i <= pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const tc = await page.getTextContent();
    let lastY = null, line = '';
    tc.items.forEach(it => {
      const y = it.transform[5];
      if (lastY !== null && Math.abs(y - lastY) > 3){
        text += line + '\n';
        line = '';
      }
      line += it.str;
      lastY = y;
    });
    if (line) text += line + '\n';
  }
  return text;
}

async function parseImage(file){
  await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
  setStatus('正在 OCR 识别，请稍候（首次较慢）…');
  const r = await Tesseract.recognize(file, 'jpn+chi_sim+eng');
  return (r && r.data && r.data.text) ? r.data.text : '';
}

async function handleFile(file){
  if (!file) return;
  const name = file.name.toLowerCase();
  const ext = name.includes('.') ? name.split('.').pop() : '';
  setStatus('正在解析 ' + file.name + ' …');

  try{
    let text = '';
    if (['txt','csv','tsv','md'].includes(ext)){
      text = await file.text();
    } else if (['xlsx','xls'].includes(ext)){
      text = await parseExcel(file);
    } else if (ext === 'docx'){
      text = await parseDocx(file);
    } else if (ext === 'pdf'){
      text = await parsePdf(file);
    } else if (['jpg','jpeg','png','webp','bmp'].includes(ext)){
      text = await parseImage(file);
    } else {
      setStatus('暂不支持该格式：.' + ext, 'err');
      return;
    }

    const entries = textToEntries(text);
    if (!entries.length){
      setStatus('未能识别出词条，请检查文件内容或改用「粘贴文本」', 'err');
      return;
    }
    setPreview(entries);
    setStatus('识别成功：共 ' + entries.length + ' 条', 'ok');
  } catch (e){
    console.error(e);
    setStatus('解析失败：' + (e && e.message ? e.message : e), 'err');
  }
}

function setPreview(entries){
  previewEntries = entries;
  const card = document.getElementById('previewCard');
  const list = document.getElementById('previewList');
  document.getElementById('previewCount').textContent = '（' + entries.length + ' 条）';

  const head = '<div class="preview-row head">' +
    '<span>#</span><span>单词</span><span>读音</span><span>释义</span></div>';
  const body = entries.slice(0, 300).map((e, i) =>
    '<div class="preview-row">' +
      '<span class="pv-idx">' + (i + 1) + '</span>' +
      '<span class="pv-w">' + esc(e.w) + '</span>' +
      '<span class="pv-r">' + esc(e.r) + '</span>' +
      '<span class="pv-m">' + esc(e.m) + '</span>' +
    '</div>'
  ).join('');
  const more = entries.length > 300
    ? '<div class="preview-row"><span></span><span style="color:#8a9099">… 其余 ' +
      (entries.length - 300) + ' 条未显示（仍会全部导入）</span></div>'
    : '';

  list.innerHTML = head + body + more;
  card.style.display = '';
}

function clearPreview(){
  previewEntries = [];
  document.getElementById('previewCard').style.display = 'none';
  document.getElementById('previewList').innerHTML = '';
}

/* 确认导入：只认开发者密钥 */
function confirmImport(){
  const mode = document.getElementById('importMode').value;
  const key  = document.getElementById('importKey').value.trim();

  if (!mode){ setStatus('请选择目标模式', 'err'); return; }
  if (key !== DEV_KEY){
    setStatus('密钥错误：只有开发者可以导入单词', 'err');
    return;
  }
  if (!previewEntries.length){
    setStatus('没有可导入的内容', 'err');
    return;
  }

  const exist = DB[mode] || [];
  const seen = new Set(exist.map(e => e.w + '|' + e.r));
  let added = 0;

  previewEntries.forEach(e => {
    const k = e.w + '|' + e.r;
    if (!seen.has(k)){ seen.add(k); exist.push(e); added++; }
  });

  DB[mode] = exist;
  saveDB();
  refreshHome();
  setStatus('导入成功：新增 ' + added + ' 条，当前「' + mode + '」共 ' + exist.length + ' 条', 'ok');
  clearPreview();
}

/* =========================================================================
   事件绑定
   ========================================================================= */
function bind(){
  /* --- 主页：模式选择 --- */
  document.getElementById('modeGrid').addEventListener('click', e => {
    const btn = e.target.closest('.mode-chip');
    if (!btn) return;
    currentMode = btn.dataset.mode;
    refreshHome();
  });

  /* --- 主页：题量快捷选择 --- */
  document.getElementById('sizeRow').addEventListener('click', e => {
    const p = e.target.closest('.size-pill');
    if (!p) return;
    document.querySelectorAll('#sizeRow .size-pill').forEach(x => x.classList.remove('active'));
    p.classList.add('active');
    document.getElementById('groupSize').value = p.dataset.n;
  });

  /* --- 主页：开始 --- */
  document.getElementById('btnStart').addEventListener('click', startQuiz);

  /* --- 主页：快速导入 --- */
  document.getElementById('btnImport').addEventListener('click', () => {
    const sel = document.getElementById('importMode');
    sel.innerHTML = MODES.map(m =>
      '<option value="' + esc(m) + '">' + esc(m) + '</option>').join('');
    sel.value = currentMode;
    setStatus('');
    show('import');
  });

  /* --- 答题页 --- */
  document.getElementById('btnKnown').addEventListener('click', onKnown);
  document.getElementById('btnUnknown').addEventListener('click', onUnknown);
  document.getElementById('btnNext').addEventListener('click', onNext);
  document.getElementById('btnWrong').addEventListener('click', onWrong);
  document.getElementById('btnPause').addEventListener('click', togglePause);
  document.getElementById('btnStop').addEventListener('click', stopQuiz);
  document.getElementById('btnResume').addEventListener('click', resumeQuiz);

  /* --- 结果页 --- */
  document.getElementById('btnRestart').addEventListener('click', startQuiz);
  document.getElementById('btnQuit').addEventListener('click', () => {
    refreshHome();
    show('home');
  });

  /* --- 导入页 --- */
  document.getElementById('importBack').addEventListener('click', () => {
    refreshHome();
    show('home');
  });

  const dz = document.getElementById('dropZone');
  const fi = document.getElementById('fileInput');

  dz.addEventListener('click', () => fi.click());
  fi.addEventListener('change', () => {
    if (fi.files && fi.files[0]) handleFile(fi.files[0]);
    fi.value = '';
  });

  ['dragenter','dragover'].forEach(ev =>
    dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('drag'); }));
  ['dragleave','drop'].forEach(ev =>
    dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('drag'); }));
  dz.addEventListener('drop', e => {
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) handleFile(f);
  });

  document.getElementById('btnParsePaste').addEventListener('click', () => {
    const text = document.getElementById('pasteArea').value;
    const entries = textToEntries(text);
    if (!entries.length){ setStatus('未能解析出词条', 'err'); return; }
    setPreview(entries);
    setStatus('解析成功：共 ' + entries.length + ' 条', 'ok');
  });

  document.getElementById('btnConfirmImport').addEventListener('click', confirmImport);
  document.getElementById('btnClearPreview').addEventListener('click', () => {
    clearPreview();
    setStatus('');
  });

  /* --- 键盘快捷键 --- */
  document.addEventListener('keydown', e => {
    if (!document.getElementById('screen-quiz').classList.contains('active')) return;
    if (state.paused) return;

    if (state.phase === 1){
      if (e.key === '1'){ e.preventDefault(); onKnown(); }
      else if (e.key === '2'){ e.preventDefault(); onUnknown(); }
    } else {
      if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); onNext(); }
      else if (e.key === 'Backspace'){ e.preventDefault(); onWrong(); }
    }
  });
}

/* ---------------- 启动 ---------------- */
bind();
refreshHome();
</script>
</body>
</html>
